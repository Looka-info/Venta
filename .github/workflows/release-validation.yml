name: Vanta Release Validation & Packaging

on:
  push:
    branches:
      - main
      - 'perf/**'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Build, Test & Package (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Rust Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Pre-build Static Runtime Library
        run: |
          gcc -c -O2 -fPIC runtime/vanta_rt.c -o runtime/vanta_rt.o
          ar rcs runtime/libvanta_rt.a runtime/vanta_rt.o
          rm -f runtime/vanta_rt.o

      - name: Verify Version Consistency
        run: |
          python3 scripts/verify_version_consistency.py --github-env --github-output

      - name: Build Release Package Archive
        run: bash scripts/package_release.sh "${VANTA_RELEASE_TAG}" x86_64-unknown-linux-gnu

      - name: Run Full Workspace Tests
        env:
          VANTA_LINKER: system
        run: cargo test --workspace --verbose

      - name: Run Specialized ABI & Differential Tests
        env:
          VANTA_LINKER: system
        run: |
          cargo test --test abi_tests
          cargo test --test differential_tests
          cargo test --test fuzz_tests
          cargo test --test version_gate_tests

      - name: Run Clean-Prefix Packaging Tests
        env:
          VANTA_LINKER: system
        run: cargo test --test packaging_tests

      - name: Verify Cryptographic Checksum
        run: |
          cd dist
          sha256sum -c "${VANTA_CHECKSUM_FILE}"

      - name: Upload Release Candidate Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VANTA_ARCHIVE_NAME }}
          path: |
            dist/${{ env.VANTA_TARBALL }}
            dist/${{ env.VANTA_CHECKSUM_FILE }}
            dist/vanta-linux-x86_64
            dist/vantac-linux-x86_64
          retention-days: 14

      - name: Publish Linux Distribution to GitHub Releases
        id: publish-release
        if: success() && (github.ref == 'refs/heads/perf/runtime-optimization' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0-RC2
          files: |
            dist/${{ env.VANTA_TARBALL }}
            dist/${{ env.VANTA_CHECKSUM_FILE }}
            dist/vanta-linux-x86_64
            dist/vantac-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
