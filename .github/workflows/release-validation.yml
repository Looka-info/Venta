name: Vanta Release Validation & Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Prepare Release Candidate artifacts for manual review'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Build, Test & Package (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Rust Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Pre-build Static Runtime Library
        run: |
          gcc -c -O2 -fPIC runtime/vanta_rt.c -o runtime/vanta_rt.o
          ar rcs runtime/libvanta_rt.a runtime/vanta_rt.o
          rm -f runtime/vanta_rt.o

      - name: Verify Version Consistency
        run: |
          python3 scripts/verify_version_consistency.py --github-env --github-output

      - name: Run Full Workspace Tests
        run: cargo test --workspace --verbose

      - name: Run Specialized ABI & Differential Tests
        run: |
          cargo test --test abi_tests
          cargo test --test differential_tests
          cargo test --test fuzz_tests
          cargo test --test version_gate_tests

      - name: Build Release Package Archive
        run: bash scripts/package_release.sh "${VANTA_RELEASE_TAG}"

      - name: Run Clean-Prefix Packaging Tests
        run: cargo test --test packaging_tests

      - name: Verify Cryptographic Checksum
        run: |
          cd dist
          sha256sum -c "${VANTA_CHECKSUM_FILE}"

      - name: Upload Release Candidate Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VANTA_ARCHIVE_NAME }}
          path: |
            dist/${{ env.VANTA_TARBALL }}
            dist/${{ env.VANTA_CHECKSUM_FILE }}
          retention-days: 14
