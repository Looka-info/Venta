name: Windows x64 Native Release Packaging & Verification

on:
  push:
    branches: [ main, perf/runtime-optimization ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows x86-64 Release Distribution
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check Code Formatting
        id: fmt
        run: cargo fmt --check
        shell: bash

      - name: Build Release Binaries (vantac, vanta)
        id: build
        run: cargo build --release --bin vantac --bin vanta
        shell: bash

      - name: Run Windows Target, Linker & Workspace Tests
        id: test
        run: |
          cargo test -p vanta_target -p vanta_linker -p vanta_sema -p vanta_parser -p vanta_lexer -p vanta_mir -p vanta_codegen_x86_64 -p vanta_codegen_aarch64 -p vanta_build -p vanta_diagnostics -p vanta_source -p vanta_fmt -p ventanext_codegen --verbose
          cargo test -p vanta_driver --test linker_e2e_tests --verbose
        shell: bash

      - name: Package Windows Distribution (ZIP + SHA-256 + Manifest)
        id: package
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts/package_release_windows.ps1 -Tag v1.0-RC2 -Target x86_64-pc-windows-msvc
        shell: pwsh

      - name: Run Uninstaller Data-Safety & Containment Tests
        id: uninstaller-test
        run: |
          pwsh -ExecutionPolicy Bypass -File tests/test_uninstaller_safety.ps1
        shell: pwsh

      - name: Run Installer Verification Tests
        id: installer-test
        run: |
          pwsh -ExecutionPolicy Bypass -File tests/test_installer_verification.ps1
        shell: pwsh

      - name: Run Isolated Windows Package Release Gate Tests
        id: isolated-test
        run: |
          pwsh -ExecutionPolicy Bypass -File tests/test_isolated_windows_package.ps1
        shell: pwsh

      - name: Upload Windows Distribution Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: vanta-windows-x86_64-v1.0-RC2
          path: |
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip.sha256
            dist/release-manifest.json
          if-no-files-found: error

      - name: Publish Windows Distribution to GitHub Releases
        id: publish-release
        if: success() && (github.ref == 'refs/heads/perf/runtime-optimization' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0-RC2
          name: "Vanta v1.0-RC2 (Multi-Platform Native Distribution)"
          body: |
            ## ⚡ Vanta Systems Programming Language — Multi-Platform Native Distribution (v1.0-RC2)

            Pure native binary release for Windows AMD64 (`x86_64-pc-windows-msvc`) with custom pure-Rust PE32+ backend and linker.
            Zero external C runtime, SDK, or toolchain dependencies required.
            All scripts (.ps1, .bat) are strictly excluded from the package archive.

            ### Package Assets
            - `vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip`: Complete self-contained toolchain containing compiler (`bin/vantac.exe`), CLI driver (`bin/vanta.exe`), full standard library (`lib/vanta/std/`), docs, and examples.
            - `vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip.sha256`: SHA-256 sidecar checksum.
            - `release-manifest.json`: Per-file SHA-256 and byte-size cryptographic inventory.
            - `vanta.exe`: Standalone Windows CLI executable.
            - `vantac.exe`: Standalone Windows reference compiler executable.
          draft: false
          prerelease: true
          files: |
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip.sha256
            dist/release-manifest.json
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc/bin/vanta.exe
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc/bin/vantac.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Authoritative Release Artifact Summary
        if: always()
        shell: pwsh
        run: |
          $zipPath = "dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip"
          $sha256Path = "dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip.sha256"
          $manifestPath = "dist/release-manifest.json"

          $zipSize = if (Test-Path $zipPath) { (Get-Item $zipPath).Length.ToString() + " bytes" } else { "N/A" }
          $zipHash = if (Test-Path $zipPath) { (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower() } else { "N/A" }
          $sidecarName = if (Test-Path $sha256Path) { [System.IO.Path]::GetFileName($sha256Path) } else { "N/A" }
          $sidecarContent = if (Test-Path $sha256Path) { (Get-Content -Path $sha256Path -Raw).Trim() } else { "N/A" }
          $manifestSize = if (Test-Path $manifestPath) { (Get-Item $manifestPath).Length.ToString() + " bytes" } else { "N/A" }
          $manifestObj = if (Test-Path $manifestPath) { try { Get-Content -Raw $manifestPath | ConvertFrom-Json } catch { $null } } else { $null }
          $payloadCount = if ($manifestObj -and $manifestObj.files) { $manifestObj.files.Count.ToString() } else { "N/A" }

          $artifactId = "${{ steps.upload-artifact.outputs.artifact-id }}"
          if ([string]::IsNullOrWhiteSpace($artifactId)) { $artifactId = "N/A (artifact not uploaded)" }
          $artifactUrl = "${{ steps.upload-artifact.outputs.artifact-url }}"
          if ([string]::IsNullOrWhiteSpace($artifactUrl)) { $artifactUrl = "N/A (artifact not uploaded)" }
          $releaseUrl = "https://github.com/Looka-info/Venta/releases/tag/v1.0-RC2"

          $isSuccess = (
            "${{ steps.fmt.outcome }}" -eq "success" -and
            "${{ steps.build.outcome }}" -eq "success" -and
            "${{ steps.test.outcome }}" -eq "success" -and
            "${{ steps.package.outcome }}" -eq "success" -and
            "${{ steps.uninstaller-test.outcome }}" -eq "success" -and
            "${{ steps.installer-test.outcome }}" -eq "success" -and
            "${{ steps.isolated-test.outcome }}" -eq "success" -and
            "${{ steps.upload-artifact.outcome }}" -eq "success"
          )
          $gateStatus = if ($isSuccess) { "**SUCCESS (All Verification Gates Passed)**" } else { "**FAILED (One or More Gates Failed)**" }

          $summary = @"
          # ⚡ Vanta Windows x86-64 Release Verification Summary

          > [!NOTE]
          > This distribution package is published to **GitHub Releases** (`v1.0-RC2`) and preserved as a verified GitHub Actions CI workflow artifact. All scripts (.ps1, .bat) are strictly excluded from the package archive.

          | Property | Authoritative CI Value |
          | :--- | :--- |
          | **Commit SHA** | `${{ github.sha }}` |
          | **Branch** | `${{ github.ref_name }}` |
          | **Workflow Run ID** | `${{ github.run_id }}` (Run #${{ github.run_number }}) |
          | **Release Gate Status** | $gateStatus |
          | **GitHub Release URL** | [$releaseUrl]($releaseUrl) |
          | **Package Filename** | `vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip` |
          | **Package Byte Size** | $zipSize |
          | **Package SHA-256** | `$zipHash` |
          | **Sidecar Filename** | `$sidecarName` |
          | **Sidecar Contents** | `$sidecarContent` |
          | **Manifest Byte Size** | $manifestSize |
          | **Tracked Payload Files** | $payloadCount |
          | **Artifact Name** | `vanta-windows-x86_64-v1.0-RC2` |
          | **Artifact ID** | $artifactId |
          | **Artifact URL** | $artifactUrl |
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8
          Write-Host $summary
