name: Windows x64 Native Release Packaging & Verification

on:
  push:
    branches: [ main, perf/runtime-optimization ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package Windows x86-64 Release Distribution
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binaries (vantac, vanta)
        run: cargo build --release --bin vantac --bin vanta
        shell: bash

      - name: Run Windows Target & Backend Integration Tests
        run: |
          cargo test -p vanta_target --verbose
          cargo test -p vanta_linker --verbose
          cargo test -p vanta_driver --test linker_e2e_tests --verbose
        shell: bash

      - name: Package Windows Distribution (ZIP + SHA-256 + Manifest)
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_release_windows.ps1 -Tag v1.0-RC2 -Target x86_64-pc-windows-msvc
        shell: cmd

      - name: Run Uninstaller Data-Safety & Preservation Tests
        run: |
          powershell -ExecutionPolicy Bypass -File tests/test_uninstaller_safety.ps1
        shell: cmd

      - name: Run Installer Verification Tests
        run: |
          powershell -ExecutionPolicy Bypass -File tests/test_installer_verification.ps1
        shell: cmd

      - name: Run Isolated Windows Package Release Gate Tests
        run: |
          powershell -ExecutionPolicy Bypass -File tests/test_isolated_windows_package.ps1
        shell: cmd

      - name: Upload Windows Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanta-windows-x86_64-v1.0-RC2
          path: |
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip
            dist/vanta-v1.0-RC2-x86_64-pc-windows-msvc.zip.sha256
            dist/release-manifest.json
          if-no-files-found: error
