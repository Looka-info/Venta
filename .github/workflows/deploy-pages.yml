name: Deploy Venta Showcase to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Showcase (Pure Venta Engine)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Static Runtime Library & Venta Compiler
        run: |
          gcc -c -O2 -fPIC runtime/vanta_rt.c -o runtime/vanta_rt.o
          ar rcs runtime/libvanta_rt.a runtime/vanta_rt.o
          rm -f runtime/vanta_rt.o
          cargo build -p vanta_driver --release
          mkdir -p packages/vanta-lang/dist/bin packages/vanta-lang/dist/lib/vanta
          cp target/release/vanta packages/vanta-lang/dist/bin/vanta
          cp target/release/vantac packages/vanta-lang/dist/bin/vantac
          cp -r library/std packages/vanta-lang/dist/lib/vanta/std
          cp runtime/libvanta_rt.a packages/vanta-lang/dist/lib/vanta/libvanta_rt.a
          chmod +x packages/vanta-lang/dist/bin/*

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Ephemeral Dist Directory
        run: mkdir -p dist

      - name: Compile and Evaluate Venta Site
        env:
          VANTA_LINKER: system
        run: |
          ./target/release/vanta run www/export.va --linker=system

      - name: Copy Static Favicons and Media
        run: |
          cp -r www/*.svg dist/ 2>/dev/null || true
          cp -r www/*.png dist/ 2>/dev/null || true
          cp -r www/*.ico dist/ 2>/dev/null || true

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy(gh-pages): automated build from pure Venta engine"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
