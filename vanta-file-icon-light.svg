<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Shadow Filter for Light Themes -->
    <filter id="vanta-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#5C3300" flood-opacity="0.3"/>
    </filter>

    <!-- Top-Left Lit Facet Gradient -->
    <linearGradient id="vanta-lit-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="30%" stop-color="#FFD600"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Bottom-Right Shaded Facet Gradient -->
    <linearGradient id="vanta-shade-light" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#F57C00"/>
      <stop offset="40%" stop-color="#E65100"/>
      <stop offset="80%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#7A2200"/>
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="vanta-ridge-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFE082" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Drop Shadow Layer -->
  <g filter="url(#vanta-shadow)">
    <!-- Thin contrast outline for light theme readability -->
    <path d="M 25.4 2.5 L 18.3 13.1 L 25.0 14.1 L 6.0 29.5 L 7.4 18.8 L 13.4 19.4 Z" fill="url(#vanta-shade-light)" stroke="#8C4300" stroke-width="0.5" stroke-linejoin="round"/>
  </g>

  <!-- Left/Upper 3D Facet (Brilliant Amber Gold) -->
  <path d="M 25.4 2.5 L 13.4 19.4 L 7.4 18.8 L 6.0 29.5 C 10.5 22.0 14.0 17.0 18.3 13.1 Z" fill="url(#vanta-lit-light)"/>

  <!-- Right/Lower 3D Facet (Deep Bronze Shadow) -->
  <path d="M 25.4 2.5 L 18.3 13.1 L 25.0 14.1 L 6.0 29.5 C 14.0 17.0 10.5 22.0 18.3 13.1 Z" fill="url(#vanta-shade-light)"/>

  <!-- Chamfer Shelf Highlight -->
  <path d="M 18.3 13.1 L 13.4 19.4" stroke="#FFF8E1" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Center Crease Spine Highlight -->
  <path d="M 25.4 2.5 L 16.5 15.6 L 6.0 29.5" stroke="url(#vanta-ridge-light)" stroke-width="0.75" stroke-linecap="round"/>
</svg>
