[package]
name = "ventanext_codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ventanext-gen"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vanta_source = { workspace = true }
vanta_diagnostics = { workspace = true }
vanta_lexer = { workspace = true }
vanta_parser = { workspace = true }

[dev-dependencies]
tempfile = "3"
